[project]
name = "loterias"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Enrique Gálvez", email = "kikega@telefonica.net" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "psycopg>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.54",
    "torch>=2.14.0",
]

[project.scripts]
loterias = "loterias:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
